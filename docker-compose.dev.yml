services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tasky
      POSTGRES_PASSWORD: tasky
      POSTGRES_DB: tasky
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasky"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tasky-network
    ports:
      - "5435:5432"

  # Redis for Bull Queue
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tasky-network
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Application (Backend + Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    env_file:
      - .env
    environment:
      # Override for Docker (uses service names instead of localhost)
      DATABASE_URL: postgresql://tasky:tasky@postgres:5432/tasky
      REDIS_HOST: redis
      # Frontend environment variable for API connection
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api
    ports:
      - "3000:3000" # Backend
      - "3001:3001" # Frontend
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
      - /app/frontend/node_modules
      - app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tasky-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  app_uploads:
    driver: local

networks:
  tasky-network:
    driver: bridge
